name: Android Release APK

# Release builds are intentionally manual.
# This workflow currently produces an unsigned release APK.
on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean before building'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: netpulse-android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Clean build
        if: inputs.clean_build
        run: |
          gradle clean --no-daemon --stacktrace

      - name: Build unsigned release APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: netpulse-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
