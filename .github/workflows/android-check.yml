name: Android Check

# No automatic push/commit trigger.
# Run this workflow manually from GitHub Actions when you want to verify the project.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netpulse-android-check
  cancel-in-progress: true

jobs:
  check:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Run lint
        run: |
          gradle :app:lintDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: netpulse-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: netpulse-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
